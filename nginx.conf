events {
    worker_connections 1024;
}

http {
    # Upstream backend pool: 3 Node.js instances (Round-Robin)
    upstream shortener_backend {
        server web-1:3000 max_fails=3 fail_timeout=10s;
        server web-2:3000 max_fails=3 fail_timeout=10s;
        server web-3:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check proxy
        location /api/health {
            proxy_pass http://shortener_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Main proxy to all URL Shortener endpoints
        location / {
            proxy_pass http://shortener_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Pass through response headers from backends
            proxy_pass_header X-Served-By;
            proxy_pass_header X-Cache;
            proxy_pass_header X-RateLimit-Limit;
            proxy_pass_header X-RateLimit-Remaining;
            proxy_pass_header X-RateLimit-Reset;
        }
    }
}
