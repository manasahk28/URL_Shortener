version: '3.8'

services:
  # Distributed Redis Cache
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Node.js Instance 1
  web-1:
    build: .
    environment:
      - PORT=3000
      - INSTANCE_ID=server-1
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - BASE_URL=http://localhost:8080
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy

  # Node.js Instance 2
  web-2:
    build: .
    environment:
      - PORT=3000
      - INSTANCE_ID=server-2
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - BASE_URL=http://localhost:8080
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy

  # Node.js Instance 3
  web-3:
    build: .
    environment:
      - PORT=3000
      - INSTANCE_ID=server-3
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - BASE_URL=http://localhost:8080
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy

  # Nginx Load Balancer (Round-Robin Proxy)
  load-balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-1
      - web-2
      - web-3
    restart: unless-stopped
